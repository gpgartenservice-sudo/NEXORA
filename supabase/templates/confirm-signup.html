<!doctype html>
<html lang="de">
  <body style="margin:0;padding:0;background:#000000;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#000000;">
      <tr>
        <td align="center" style="padding:48px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;">
            <tr>
              <td align="center" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;font-weight:800;letter-spacing:6px;color:#ffffff;padding-bottom:40px;">
                NEXORA
              </td>
            </tr>
            <tr>
              <td style="background:#0e0e0f;border:1px solid #232326;border-radius:16px;padding:36px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                <h1 style="margin:0 0 12px;font-size:22px;line-height:28px;color:#ffffff;text-align:center;">Bestätige deine E-Mail</h1>
                <p style="margin:0 0 28px;font-size:15px;line-height:22px;color:#8e8e93;text-align:center;">Willkommen bei NEXORA! Gib diesen Code in der App ein, um dein Konto zu aktivieren.</p>
                <div style="background:#000000;border:1px solid #232326;border-radius:12px;padding:20px 0;text-align:center;font-size:32px;font-weight:700;letter-spacing:10px;color:#ffffff;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</div>
                <p style="margin:28px 0 0;font-size:13px;line-height:20px;color:#55555a;text-align:center;">Der Code ist eine Stunde gültig. Du hast dich nicht bei NEXORA registriert? Dann kannst du diese E-Mail einfach ignorieren.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top:28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#55555a;">
                Diese E-Mail wurde an {{ .Email }} gesendet.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
